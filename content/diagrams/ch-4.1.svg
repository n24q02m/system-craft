<svg viewBox="0 0 640 164" role="img" aria-label="So sánh TCP+TLS1.2 với TLS1.3 và QUIC HTTP/3 về số RTT và giữ kết nối khi đổi mạng" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-4-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">SO SÁNH BẮT TAY &amp; ĐỨT GÃY: TCP+TLS1.2 · TLS1.3 · QUIC/HTTP3</text>
  <rect class="box" x="10" y="30" width="196" height="118"/>
  <text x="20" y="48" font-size="11.5" font-weight="600">TCP + TLS 1.2</text>
  <text x="20" y="63" font-size="9.5" class="dim">2–3 RTT trước byte dữ liệu</text>
  <text x="20" y="82" text-anchor="start" font-size="9.8">• Đổi WiFi → 4G = đứt hẳn</text>
  <text x="20" y="98" text-anchor="start" font-size="9.8">• Mất 1 gói = treo mọi stream</text>
  <text x="20" y="114" text-anchor="start" font-size="9.8" class="dim">• Tốt nội cụm dùng H2 + offload</text>
  <rect class="box-soft" x="222" y="30" width="196" height="118"/>
  <text x="232" y="48" font-size="11.5" font-weight="600">TLS 1.3 (RFC 8446)</text>
  <text x="232" y="63" font-size="9.5" class="dim">1-RTT (0-RTT chỉ idempotent)</text>
  <text x="232" y="82" text-anchor="start" font-size="9.8">• Bỏ cipher yếu, 0-RTT replay</text>
  <text x="232" y="98" text-anchor="start" font-size="9.8">• Chỉ GET / query dùng 0-RTT</text>
  <text x="232" y="114" text-anchor="start" font-size="9.8" class="dim">• Không bao giờ cho POST tiền</text>
  <rect class="box-accent" x="434" y="30" width="196" height="118"/>
  <text x="444" y="48" font-size="11.5" font-weight="600">QUIC / HTTP3 (UDP)</text>
  <text x="444" y="63" font-size="9.5" class="dim">Handshake + crypto gộp 1 RTT</text>
  <text x="444" y="82" text-anchor="start" font-size="9.8">• Stream độc lập (hết HoL)</text>
  <text x="444" y="98" text-anchor="start" font-size="9.8">• Connection ID sống qua IP</text>
  <text x="444" y="114" text-anchor="start" font-size="9.8" class="dim">• Đặt edge cho mobile user</text>
</svg>
