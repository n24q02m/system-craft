<svg viewBox="0 0 640 168" role="img" aria-label="Fencing token tăng đơn điệu chặn leader cũ tỉnh lại sau GC pause ghi đè dữ liệu" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-8-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">RAFT TERM · LEASE HẾT HẠN &amp; FENCING TOKEN CHỐNG ZOMBIE LEADER</text>
  <rect class="box-warn" x="10" y="30" width="180" height="40"/>
  <text x="100.0" y="48" text-anchor="middle" font-size="11" font-weight="600">Node A (Leader cũ, GC pause)</text>
  <text x="100.0" y="63" text-anchor="middle" font-size="9.5" class="dim">giữ Fencing Token = 33</text>
  <rect class="box-accent" x="230" y="30" width="180" height="40"/>
  <text x="320.0" y="48" text-anchor="middle" font-size="11" font-weight="600">Node B (Leader mới, Term N+1)</text>
  <text x="320.0" y="63" text-anchor="middle" font-size="9.5" class="dim">cấp Token = 34 (Quorum)</text>
  <rect class="box-ok" x="450" y="30" width="180" height="40"/>
  <text x="540.0" y="48" text-anchor="middle" font-size="11" font-weight="600">Storage / Resource</text>
  <text x="540.0" y="63" text-anchor="middle" font-size="9.5" class="dim">chỉ nhận token ≥ max_seen</text>
  <path class="flow" d="M320 70 V102 H446" marker-end="url(#arr-8-2)"/>
  <text x="385" y="96" text-anchor="middle" font-size="9.5">Ghi token=34 (OK)</text>
  <path class="flow" d="M100 70 V126 H446" marker-end="url(#arr-8-2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="9.5" class="dim">Tỉnh dậy gửi ghi muộn token=33 → BỊ TỪ CHỐI!</text>
  <text x="320" y="154" text-anchor="middle" font-size="9.8" class="dim">Consensus = đa số N/2+1 (mất ≥(N+1)/2 là dừng ghi hoàn toàn) · Election timeout ≥ ~10× RTT</text>
</svg>
