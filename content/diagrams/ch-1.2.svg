<svg viewBox="0 0 640 188" role="img" aria-label="So sánh bố cục bộ nhớ AoS lãng phí dòng cache 64B với SoA thân thiện SIMD" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-1-2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">BỐ CỤC DỮ LIỆU TRONG DÒNG CACHE 64 BYTE: AoS VS SoA</text>
  <text x="10" y="42" text-anchor="start" font-size="10.5" font-weight="600">AoS (Array of Structs) — đọc x[i] kéo cả y,z,vy,vz vô ích:</text>
  <rect class="box-warn" x="10" y="52" width="76" height="30"/>
  <text x="48.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">x₀</text>
  <rect class="box-soft" x="88" y="52" width="76" height="30"/>
  <text x="126.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">y₀</text>
  <rect class="box-soft" x="166" y="52" width="76" height="30"/>
  <text x="204.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">z₀</text>
  <rect class="box-soft" x="244" y="52" width="76" height="30"/>
  <text x="282.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">vy₀</text>
  <rect class="box-warn" x="322" y="52" width="76" height="30"/>
  <text x="360.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">x₁</text>
  <rect class="box-soft" x="400" y="52" width="76" height="30"/>
  <text x="438.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">y₁</text>
  <rect class="box-soft" x="478" y="52" width="76" height="30"/>
  <text x="516.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">z₁</text>
  <rect class="box-soft" x="556" y="52" width="76" height="30"/>
  <text x="594.0" y="71.0" text-anchor="middle" font-size="11" font-weight="600">vy₁</text>
  <text x="10" y="102" text-anchor="start" font-size="10.5" font-weight="600">SoA (Structure of Arrays) — 1 dòng cache 64B nuôi đủ 8–16 phần tử SIMD:</text>
  <rect class="box-accent" x="10" y="112" width="76" height="30"/>
  <text x="48.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[0]</text>
  <rect class="box-accent" x="88" y="112" width="76" height="30"/>
  <text x="126.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[1]</text>
  <rect class="box-accent" x="166" y="112" width="76" height="30"/>
  <text x="204.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[2]</text>
  <rect class="box-accent" x="244" y="112" width="76" height="30"/>
  <text x="282.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[3]</text>
  <rect class="box-accent" x="322" y="112" width="76" height="30"/>
  <text x="360.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[4]</text>
  <rect class="box-accent" x="400" y="112" width="76" height="30"/>
  <text x="438.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[5]</text>
  <rect class="box-accent" x="478" y="112" width="76" height="30"/>
  <text x="516.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[6]</text>
  <rect class="box-accent" x="556" y="112" width="76" height="30"/>
  <text x="594.0" y="131.0" text-anchor="middle" font-size="11" font-weight="600">x[7]</text>
  <line class="axis dashed" x1="10" y1="154" x2="634" y2="154"/>
  <text x="320" y="172" text-anchor="middle" font-size="10" class="dim">L1 (~4 chu kỳ) → L3 (~45 chu kỳ) → DRAM (~250 chu kỳ): tuần tự hoá để compiler vector hoá</text>
</svg>
