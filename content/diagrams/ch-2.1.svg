<svg viewBox="0 0 640 200" role="img" aria-label="Phân biệt VSZ RSS PSS trong bộ nhớ ảo và bẫy Copy-on-Write khi fork tiến trình lớn" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-2-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">KHÔNG GIAN ĐỊA CHỈ ẢO · VSZ / RSS / PSS &amp; BẪY COPY-ON-WRITE</text>
  <rect class="box-soft" x="10" y="30" width="190" height="92"/>
  <text x="20" y="48" font-size="11.5" font-weight="600">VSZ (ảo hoàn toàn)</text>
  <text x="20" y="63" font-size="9.5" class="dim">Mọi mmap + thư viện chưa chạm</text>
  <text x="20" y="76" font-size="9.5" class="dim">Không đo lượng RAM thật</text>
  <rect class="box-warn" x="216" y="30" width="196" height="92"/>
  <text x="226" y="48" font-size="11.5" font-weight="600">RSS (đếm kép shared)</text>
  <text x="226" y="63" font-size="9.5" class="dim">Cộng đủ lib .so cho từng pod</text>
  <text x="226" y="76" font-size="9.5" class="dim">10 pod dùng chung lib → phồng ảo</text>
  <rect class="box-accent" x="428" y="30" width="202" height="92"/>
  <text x="438" y="48" font-size="11.5" font-weight="600">PSS (thước đúng để sizing)</text>
  <text x="438" y="63" font-size="9.5" class="dim">Shared RAM ÷ số process giữ</text>
  <text x="438" y="76" font-size="9.5" class="dim">Tổng PSS = RAM vật lý thật</text>
  <path class="flow" d="M200 76 H212" marker-end="url(#arr-2-1)"/>
  <path class="flow" d="M412 76 H424" marker-end="url(#arr-2-1)"/>
  <rect class="box-warn" x="10" y="140" width="620" height="48"/>
  <text x="20" y="158" font-size="11.5" font-weight="600">Cảnh báo fork() + Copy-on-Write (vd Redis BGSAVE)</text>
  <text x="20" y="173" font-size="9.5" class="dim">Cha ghi vào heap lúc con đang chạy → nhân đôi trang vật lý → chạm cgroup limit → OOM Killer</text>
</svg>
