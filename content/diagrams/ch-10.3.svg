<svg viewBox="0 0 640 166" role="img" aria-label="Chuỗi AuthN OAuth 2.1 và token thu hồi được kết hợp ba mô hình AuthZ RBAC ABAC ReBAC" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-10-3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">OAUTH 2.1 + PASSKEY &amp; QUYẾT ĐỊNH THU HỒI SESSION VS JWT NGẮN HẠN</text>
  <rect class="box-accent" x="10" y="30" width="198" height="56"/>
  <text x="20" y="48" font-size="11.5" font-weight="600">AuthN: OAuth 2.1 + PKCE</text>
  <text x="20" y="63" font-size="9.5" class="dim">Passkey/WebAuthn chống phishing</text>
  <rect class="box" x="224" y="30" width="200" height="56"/>
  <text x="234" y="48" font-size="11.5" font-weight="600">Access Token (JWT ~5 phút)</text>
  <text x="234" y="63" font-size="9.5" class="dim">Stateless xác thực nhanh</text>
  <rect class="box-warn" x="440" y="30" width="190" height="56"/>
  <text x="450" y="48" font-size="11.5" font-weight="600">Refresh Store (Thu hồi tức thì)</text>
  <text x="450" y="63" font-size="9.5" class="dim">Xoá store/SCIM = đá ngay (I-064)</text>
  <path class="flow" d="M208 58 H220" marker-end="url(#arr-10-3)"/>
  <path class="flow" d="M424 58 H436" marker-end="url(#arr-10-3)"/>
  <rect class="box-soft" x="10" y="106" width="198" height="46"/>
  <text x="20" y="124" font-size="11.5" font-weight="600">RBAC (theo vai)</text>
  <text x="20" y="139" font-size="9.5" class="dim">Đơn giản, hợp tổ chức gọn</text>
  <rect class="box-soft" x="224" y="106" width="200" height="46"/>
  <text x="234" y="124" font-size="11.5" font-weight="600">ABAC (theo thuộc tính)</text>
  <text x="234" y="139" font-size="9.5" class="dim">Ngữ cảnh phòng ban, IP, thời gian</text>
  <rect class="box-ok" x="440" y="106" width="190" height="46"/>
  <text x="450" y="124" font-size="11.5" font-weight="600">ReBAC (đồ thị quan hệ)</text>
  <text x="450" y="139" font-size="9.5" class="dim">Ai là chủ/thành viên tài nguyên nào</text>
</svg>
