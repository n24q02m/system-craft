<svg viewBox="0 0 640 174" role="img" aria-label="Đường congUtilization-Latency với ngưỡng gối 80 phần trăm cùng định luật Little và Amdahl" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-3-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">ĐƯỜNG CONG HÀNG ĐỢI M/M/1: ĐỘ TRỄ TĂNG PHI TUYẾN KHI TẢI &gt; 80%</text>
  <line class="axis" x1="48" y1="146" x2="368" y2="146"/>
  <line class="axis" x1="48" y1="30" x2="48" y2="146"/>
  <line class="dashed axis" x1="280" y1="30" x2="280" y2="146"/>
  <path class="area-warn" d="M280,146 L280,104 Q324,84 352,32 L368,32 L368,146 Z"/>
  <path class="curve-accent" d="M52,140 C150,137 230,130 280,104 C318,84 338,54 354,32"/>
  <text x="42" y="144" text-anchor="end" font-size="10" class="num">W</text>
  <text x="280" y="162" text-anchor="middle" font-size="9.5" class="num">ρ = 80% (biên)</text>
  <text x="354" y="162" text-anchor="middle" font-size="9.5" class="num">95%</text>
  <rect class="box-accent" x="390" y="30" width="240" height="38"/>
  <text x="400" y="48" font-size="11.5" font-weight="600">Little&#x27;s Law: L = λ × W</text>
  <text x="400" y="63" font-size="9.5" class="dim">Cần biết 2 để sizing đúng 1</text>
  <rect class="box" x="390" y="76" width="240" height="38"/>
  <text x="400" y="94" font-size="11.5" font-weight="600">Amdahl: 1 / (s + (1−s)/n)</text>
