  <rect class="box-warn" x="390" y="122" width="240" height="38"/>
  <text x="400" y="140" font-size="11.5" font-weight="600">Backpressure từ chối sớm</text>
  <text x="400" y="155" font-size="9.5" class="dim">Tránh hàng đợi vô hạn nổ RAM</text>
</svg>
