<svg viewBox="0 0 640 178" role="img" aria-label="Cơ chế Write Amplification của NAND SSD và rủi ro URE khi rebuild RAID5 dung lượng TB" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-1-4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">NAND FLASH WRITE CLIFF &amp; XÁC SUẤT URE KHI REBUILD RAID</text>
  <rect class="box" x="10" y="30" width="296" height="130"/>
  <text x="20" y="48" font-size="11.5" font-weight="600">SSD nội tại: Write Amplification (WAF)</text>
  <text x="20" y="63" font-size="9.5" class="dim">Ghi 4–16 KB theo trang; Xoá theo khối (MB)</text>
  <rect class="box-ok" x="24" y="78" width="120" height="36"/>
  <text x="84.0" y="96" text-anchor="middle" font-size="11" font-weight="600">Ghi tuần tự</text>
  <text x="84.0" y="111" text-anchor="middle" font-size="9.5" class="dim">WAF ~1.0–1.5</text>
  <rect class="box-warn" x="164" y="78" width="128" height="36"/>
  <text x="228.0" y="96" text-anchor="middle" font-size="11" font-weight="600">Ghi ngẫu nhiên ≥80%</text>
  <text x="228.0" y="111" text-anchor="middle" font-size="9.5" class="dim">GC chạy → Write Cliff</text>
  <text x="24" y="144" text-anchor="start" font-size="9.5" class="dim">PLP tụ điện giữ lời hứa fsync (~10 µs)</text>
  <rect class="box" x="326" y="30" width="304" height="130"/>
  <text x="336" y="48" font-size="11.5" font-weight="600">RAID5 đĩa lớn vs URE (~10⁻¹⁴–10⁻¹⁵ bit)</text>
  <text x="336" y="63" font-size="9.5" class="dim">12 × 12 TB rebuild ≈ 132 TB đọc toàn phần</text>
  <rect class="box-warn" x="340" y="78" width="132" height="36"/>
  <text x="406.0" y="96" text-anchor="middle" font-size="11" font-weight="600">RAID 5 (parity đơn)</text>
  <text x="406.0" y="111" text-anchor="middle" font-size="9.5" class="dim">Xác suất URE nổ cao</text>
  <rect class="box-accent" x="484" y="78" width="132" height="36"/>
  <text x="550.0" y="96" text-anchor="middle" font-size="11" font-weight="600">RAID 10 / 3× Rep / EC</text>
  <text x="550.0" y="111" text-anchor="middle" font-size="9.5" class="dim">An toàn rebuild / đọc</text>
  <text x="340" y="144" text-anchor="start" font-size="9.5" class="dim">Benchmark ngắn 60s che cliff; cần fio ≥30 phút</text>
</svg>
