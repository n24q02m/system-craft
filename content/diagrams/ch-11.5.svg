<svg viewBox="0 0 640 160" role="img" aria-label="Vòng phản hồi FinOps gắn unit economics và các khoản ẩn egress NAT cross-region" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-11-5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">VÒNG QUẢN TRỊ FINOPS &amp; CHI PHÍ ẨN KIẾN TRÚC</text>
  <rect class="box-accent" x="10" y="32" width="142" height="48"/>
  <text x="81.0" y="50" text-anchor="middle" font-size="11" font-weight="600">1. Tag &amp; Unit Cost</text>
  <text x="81.0" y="65" text-anchor="middle" font-size="9.5" class="dim">$ / 1k req hay $/đơn</text>
