  <path class="flow" d="M152 56 H168" marker-end="url(#arr-11-5)"/>
  <path class="flow" d="M314 56 H330" marker-end="url(#arr-11-5)"/>
  <path class="flow" d="M476 56 H492" marker-end="url(#arr-11-5)"/>
  <rect class="box-soft" x="10" y="102" width="620" height="44"/>
  <text x="20" y="128.0" font-size="11.5" font-weight="600">Không tag = không đo được · Tiết kiệm nhất là tắt idle và đặt dữ liệu gần compute (bỏ NAT/Egress)</text>
