<svg viewBox="0 0 640 166" role="img" aria-label="Chuỗi phòng thủ 4 lớp: Load Shedding, Bulkhead, Circuit Breaker và Retry kèm Jitter" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-8-5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">BỐN TẦNG CHỊU LỖI CẦN ĐỦ (THIẾU MỘT LÀ SẬP LAN TRUYỀN)</text>
  <rect class="box-warn" x="10" y="34" width="138" height="52"/>
  <text x="79.0" y="52" text-anchor="middle" font-size="11" font-weight="600">1. Load Shedding</text>
  <text x="79.0" y="67" text-anchor="middle" font-size="9.5" class="dim">Trả 503 sớm giữ lõi</text>
  <rect class="box-accent" x="170" y="34" width="138" height="52"/>
  <text x="239.0" y="52" text-anchor="middle" font-size="11" font-weight="600">2. Bulkhead</text>
  <text x="239.0" y="67" text-anchor="middle" font-size="9.5" class="dim">Pool riêng từng nhóm</text>
  <rect class="box" x="330" y="34" width="138" height="52"/>
  <text x="399.0" y="52" text-anchor="middle" font-size="11" font-weight="600">3. Circuit Breaker</text>
  <text x="399.0" y="67" text-anchor="middle" font-size="9.5" class="dim">CLOSED ↔ OPEN ↔ HALF</text>
  <rect class="box-ok" x="490" y="34" width="140" height="52"/>
  <text x="560.0" y="52" text-anchor="middle" font-size="11" font-weight="600">4. Retry + Full Jitter</text>
  <text x="560.0" y="67" text-anchor="middle" font-size="9.5" class="dim">Budget ≤ 10% traffic</text>
  <path class="flow" d="M148 60 H166" marker-end="url(#arr-8-5)"/>
  <path class="flow" d="M308 60 H326" marker-end="url(#arr-8-5)"/>
  <path class="flow" d="M468 60 H486" marker-end="url(#arr-8-5)"/>
  <rect class="box-soft" x="10" y="108" width="620" height="44"/>
  <text x="20" y="126" font-size="11.5" font-weight="600">Nguyên lý chống bão: Retry không jitter = nhân tải lên đúng lúc dependency hấp hối</text>
  <text x="20" y="141" font-size="9.5" class="dim">Luôn cấp fallback thật khi Circuit Breaker chuyển OPEN và đặt timeout con &lt; cha</text>
</svg>
