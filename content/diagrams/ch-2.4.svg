<svg viewBox="0 0 640 166" role="img" aria-label="Quy trình 4 bước ghi tệp an toàn qua cúp điện và so sánh Buffered I/O với O_DIRECT" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-2-4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">CHECKLIST 4 BƯỚC GHI BỀN CHỐNG MẤT KHI CÚP ĐIỆN (PAGE CACHE VS FSYNC)</text>
  <rect class="box" x="10" y="32" width="134" height="48"/>
  <text x="77.0" y="50" text-anchor="middle" font-size="11" font-weight="600">1. Ghi tệp tạm</text>
  <text x="77.0" y="65" text-anchor="middle" font-size="9.5" class="dim">write(file.tmp)</text>
  <rect class="box-accent" x="168" y="32" width="136" height="48"/>
  <text x="236.0" y="50" text-anchor="middle" font-size="11" font-weight="600">2. Ép dữ liệu</text>
  <text x="236.0" y="65" text-anchor="middle" font-size="9.5" class="dim">fsync(tmp) → đĩa</text>
  <rect class="box" x="328" y="32" width="138" height="48"/>
  <text x="397.0" y="50" text-anchor="middle" font-size="11" font-weight="600">3. Đổi tên nguyên tử</text>
  <text x="397.0" y="65" text-anchor="middle" font-size="9.5" class="dim">rename(tmp → chính)</text>
  <rect class="box-warn" x="490" y="32" width="140" height="48"/>
  <text x="560.0" y="50" text-anchor="middle" font-size="11" font-weight="600">4. Ép thư mục (dễ quên)</text>
  <text x="560.0" y="65" text-anchor="middle" font-size="9.5" class="dim">fsync(dir) metadata</text>
  <path class="flow" d="M144 56 H164" marker-end="url(#arr-2-4)"/>
  <path class="flow" d="M304 56 H324" marker-end="url(#arr-2-4)"/>
  <path class="flow" d="M466 56 H486" marker-end="url(#arr-2-4)"/>
  <rect class="box-soft" x="10" y="104" width="300" height="46"/>
  <text x="20" y="122" font-size="11.5" font-weight="600">Buffered I/O (mặc định app)</text>
  <text x="20" y="137" font-size="9.5" class="dim">Qua Page Cache RAM · Writeback theo vm.dirty_*</text>
  <rect class="box-soft" x="330" y="104" width="300" height="46"/>
  <text x="340" y="122" font-size="11.5" font-weight="600">O_DIRECT (Database tự quản buffer)</text>
  <text x="340" y="137" font-size="9.5" class="dim">Bỏ double-cache · Bắt buộc alignment 512B/4KB</text>
</svg>
