<svg viewBox="0 0 640 164" role="img" aria-label="Chuỗi SLI SLO SLA cùng hợp đồng Error Budget và cảnh báo burn-rate đa cửa sổ" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-11-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">CHUỖI SLI → SLO → SLA &amp; ERROR BUDGET MULTI-WINDOW BURN ALERT</text>
  <rect class="box" x="10" y="32" width="138" height="48"/>
  <text x="79.0" y="50" text-anchor="middle" font-size="11" font-weight="600">SLI (Trải nghiệm)</text>
  <text x="79.0" y="65" text-anchor="middle" font-size="9.5" class="dim">% req &lt; 300ms (ko CPU)</text>
  <rect class="box-accent" x="168" y="32" width="144" height="48"/>
  <text x="240.0" y="50" text-anchor="middle" font-size="11" font-weight="600">SLO (Mục tiêu nội)</text>
  <text x="240.0" y="65" text-anchor="middle" font-size="9.5" class="dim">Vd 99.9% ⇒ 43.8′/tháng</text>
  <rect class="box-soft" x="332" y="32" width="142" height="48"/>
  <text x="403.0" y="50" text-anchor="middle" font-size="11" font-weight="600">SLA (Hợp đồng ngoài)</text>
  <text x="403.0" y="65" text-anchor="middle" font-size="9.5" class="dim">99.5% (luôn lỏng hơn SLO)</text>
  <rect class="box-warn" x="494" y="32" width="136" height="48"/>
  <text x="562.0" y="50" text-anchor="middle" font-size="11" font-weight="600">Error Budget</text>
  <text x="562.0" y="65" text-anchor="middle" font-size="9.5" class="dim">Hết → đóng băng release</text>
  <path class="flow" d="M148 56 H164" marker-end="url(#arr-11-1)"/>
  <path class="flow" d="M312 56 H328" marker-end="url(#arr-11-1)"/>
  <path class="flow" d="M474 56 H490" marker-end="url(#arr-11-1)"/>
  <rect class="box-warn" x="10" y="102" width="302" height="48"/>
  <text x="20" y="120" font-size="11.5" font-weight="600">Fast Burn Alert (1h = 14.4× · 5′ kiểm)</text>
  <text x="20" y="135" font-size="9.5" class="dim">Page on-call ngay khi đốt 2% budget/giờ</text>
  <rect class="box-ok" x="328" y="102" width="302" height="48"/>
  <text x="338" y="120" font-size="11.5" font-weight="600">Slow Burn (6h = 6×) · Ticket/giờ làm việc</text>
  <text x="338" y="135" font-size="9.5" class="dim">Loại nhiễu ban đêm của ngưỡng tĩnh cũ</text>
</svg>
