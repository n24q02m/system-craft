<svg viewBox="0 0 640 238" role="img" aria-label="Bậc thang độ trễ từ L1 cache đến liên lục địa theo thang logarit" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-1-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">BẬC THANG ĐỘ TRỄ (THANG LOGARIT: MỖI NẤC ≈ 10×–1000×)</text>
  <text x="10" y="44" text-anchor="start" font-size="10.5">L1 Cache</text>
  <rect class="box-soft" x="128" y="32" width="400" height="16"/>
  <rect class="bar-accent" x="128" y="32" width="18" height="16"/>
  <text x="536" y="44" text-anchor="start" font-size="9.8" class="num">~1 ns (1×)</text>
  <text x="10" y="70" text-anchor="start" font-size="10.5">L2 Cache</text>
  <rect class="box-soft" x="128" y="58" width="400" height="16"/>
  <rect class="bar-accent" x="128" y="58" width="36" height="16"/>
  <text x="536" y="70" text-anchor="start" font-size="9.8" class="num">~4 ns</text>
  <text x="10" y="96" text-anchor="start" font-size="10.5">DRAM (RAM)</text>
  <rect class="box-soft" x="128" y="84" width="400" height="16"/>
  <rect class="bar-accent" x="128" y="84" width="92" height="16"/>
  <text x="536" y="96" text-anchor="start" font-size="9.8" class="num">~100 ns (100×)</text>
  <text x="10" y="122" text-anchor="start" font-size="10.5">SSD NVMe</text>
  <rect class="box-soft" x="128" y="110" width="400" height="16"/>
  <rect class="bar" x="128" y="110" width="185" height="16"/>
  <text x="536" y="122" text-anchor="start" font-size="9.8" class="num">~100 µs (10⁵×)</text>
  <text x="10" y="148" text-anchor="start" font-size="10.5">Cùng AZ / Region</text>
  <rect class="box-soft" x="128" y="136" width="400" height="16"/>
  <rect class="bar" x="128" y="136" width="248" height="16"/>
  <text x="536" y="148" text-anchor="start" font-size="9.8" class="num">~0.5 ms</text>
  <text x="10" y="174" text-anchor="start" font-size="10.5">HDD Seek</text>
  <rect class="box-soft" x="128" y="162" width="400" height="16"/>
  <rect class="bar" x="128" y="162" width="315" height="16"/>
  <text x="536" y="174" text-anchor="start" font-size="9.8" class="num">~10 ms (10⁷×)</text>
  <text x="10" y="200" text-anchor="start" font-size="10.5">Liên lục địa</text>
  <rect class="box-soft" x="128" y="188" width="400" height="16"/>
  <rect class="bar" x="128" y="188" width="390" height="16"/>
  <text x="536" y="200" text-anchor="start" font-size="9.8" class="num">~100 ms (10⁸×)</text>
  <text x="128" y="226" text-anchor="start" font-size="9.8" class="dim">Bẫy N+1: 100 vòng query mạng thay vì 1 batch = cộng ~50 ms thành nghẽn chính</text>
</svg>
