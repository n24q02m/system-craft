<svg viewBox="0 0 640 174" role="img" aria-label="Chín trạm từ DNS/LB tới DB và Async Log với phân bổ timeout budget và kích thước pool" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr-3-10" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.5 L6.5,3.5 L0,6.5 z" fill="currentColor"/></marker></defs>
  <text class="lbl dim" x="10" y="16" text-anchor="start" font-size="9.5">CHÍN TRẠM TRÊN MỘT REQUEST &amp; CHIA NGÂN SÁCH TIMEOUT (CON &lt; CHA)</text>
  <rect class="box" x="10" y="32" width="114" height="42"/>
  <text x="67.0" y="50" text-anchor="middle" font-size="11" font-weight="600">1. DNS / LB</text>
  <text x="67.0" y="65" text-anchor="middle" font-size="9.5" class="dim">budget: 20 ms</text>
  <rect class="box" x="136" y="32" width="114" height="42"/>
  <text x="193.0" y="50" text-anchor="middle" font-size="11" font-weight="600">2. Ingress TLS</text>
  <text x="193.0" y="65" text-anchor="middle" font-size="9.5" class="dim">budget: 40 ms</text>
  <rect class="box-accent" x="262" y="32" width="114" height="42"/>
  <text x="319.0" y="50" text-anchor="middle" font-size="11" font-weight="600">3. App Pool</text>
  <text x="319.0" y="65" text-anchor="middle" font-size="9.5" class="dim">L = λ × W</text>
  <rect class="box" x="388" y="32" width="114" height="42"/>
  <text x="445.0" y="50" text-anchor="middle" font-size="11" font-weight="600">4. Codec/Parse</text>
  <text x="445.0" y="65" text-anchor="middle" font-size="9.5" class="dim">orjson vs std</text>
  <rect class="box" x="514" y="32" width="116" height="42"/>
  <text x="572.0" y="50" text-anchor="middle" font-size="11" font-weight="600">5. Client Pool</text>
  <text x="572.0" y="65" text-anchor="middle" font-size="9.5" class="dim">downstream</text>
  <path class="flow" d="M124 53 H132" marker-end="url(#arr-3-10)"/>
  <path class="flow" d="M250 53 H258" marker-end="url(#arr-3-10)"/>
  <path class="flow" d="M376 53 H384" marker-end="url(#arr-3-10)"/>
  <path class="flow" d="M502 53 H510" marker-end="url(#arr-3-10)"/>
  <path class="flow" d="M572 74 V92 H572" marker-end="url(#arr-3-10)"/>
  <rect class="box-warn" x="514" y="96" width="116" height="42"/>
  <text x="572.0" y="114" text-anchor="middle" font-size="11" font-weight="600">6. DB Pool</text>
  <text x="572.0" y="129" text-anchor="middle" font-size="9.5" class="dim">cạn trước DB</text>
  <rect class="box-accent" x="350" y="96" width="140" height="42"/>
  <text x="420.0" y="114" text-anchor="middle" font-size="11" font-weight="600">7. DB / Cache Engine</text>
  <text x="420.0" y="129" text-anchor="middle" font-size="9.5" class="dim">deadline còn 120 ms</text>
  <rect class="box" x="184" y="96" width="144" height="42"/>
  <text x="256.0" y="114" text-anchor="middle" font-size="11" font-weight="600">8. Response Path</text>
  <text x="256.0" y="129" text-anchor="middle" font-size="9.5" class="dim">stream / gzip</text>
  <rect class="box-soft" x="10" y="96" width="152" height="42"/>
  <text x="86.0" y="114" text-anchor="middle" font-size="11" font-weight="600">9. Telemetry Async</text>
  <text x="86.0" y="129" text-anchor="middle" font-size="9.5" class="dim">không chặn đường nóng</text>
  <path class="flow" d="M514 117 H494" marker-end="url(#arr-3-10)"/>
  <path class="flow" d="M350 117 H332" marker-end="url(#arr-3-10)"/>
  <path class="flow" d="M184 117 H166" marker-end="url(#arr-3-10)"/>
  <text x="320" y="160" text-anchor="middle" font-size="9.8" class="dim">Chữa nhanh trạm 3 mà bỏ quên trạm 6 = dời điểm nghẽn thẳng xuống pool DB</text>
</svg>
