name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify book, labs, Astro site & 4-format builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install WeasyPrint system libs and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libc6-dev libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libharfbuzz0b libffi8 fonts-dejavu-core

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python & Astro dependencies
        run: |
          uv sync --frozen --dev
          bun install --cwd site --frozen-lockfile

      - name: Run F1/F2/F3/F4 validators and labs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python tools/edu_order_check.py --quiet
          uv run python tools/red_thread_check.py --with-src
          uv run python tools/red_thread_edu_check.py --strict
          uv run python tools/ledger_coverage_check.py --strict
          uv run python tools/benchmark_provenance_check.py --strict
          uv run python tools/maintenance_check.py
          uv run python labs/verify_labs.py --fast

      - name: Build glossary, 4-format release, KIT, slides & trial pack
        run: |
          uv run python tools/build_glossary.py
          uv run python tools/package_release.py
          uv run python kit/make_kit.py
          uv run python kit/slides/build_slides.py
          uv run python tools/build_trial_pack.py

      - name: Build Astro static site & Pagefind index
        run: bun run --cwd site build

      - name: Run full pytest suite
        run: uv run pytest -v
